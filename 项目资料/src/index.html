<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f7fa" />
    <meta name="apple-mobile-web-app-title" content="健身计划" />
    <meta name="application-name" content="健身计划" />
    <meta property="og:title" content="健身计划" />
    <meta name="description" content="可复用的训练模板，按实际日期记录每组重量。" />
    <title>健身计划</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-barbell" viewBox="0 0 24 24"><path d="M2 9v6M5 6v12M19 6v12M22 9v6M5 12h14" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3" /><path d="M8 3v4m8-4v4M4 11h16m-11 4h2m4 0h2m-8 3h2" /></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 7M4 5v6h6m2-4v5l3 2" /></symbol>
      <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zm10-3h.01" /></symbol>
    </svg>
    <header class="site-header shell">
      <a class="brand" href="#top"><span class="brand-mark"><svg class="icon"><use href="#i-barbell" /></svg></span><span>健身计划</span></a>
      <nav aria-label="工具"><a href="#history" id="historyLink"><svg class="icon"><use href="#i-history" /></svg>训练记录</a><button type="button" id="printButton"><svg class="icon"><use href="#i-print" /></svg>打印</button></nav>
    </header>
    <main class="shell" id="top">
      <section id="schedule" aria-labelledby="schedule-title">
        <div class="calendar-heading">
          <div><h1 id="schedule-title">训练模板</h1><p class="calendar-range">重量仅供参考</p></div>
          <button type="button" class="primary-button" id="openWorkout"><svg class="icon"><use href="#i-plus" /></svg>记录训练</button>
        </div>
        <div class="calendar-meta"><span id="progressText"></span><div class="calendar-legend"><span><i class="legend-dot completed"></i>已练过</span></div></div>
        <div class="calendar-board">
          <div class="calendar-grid" id="planCalendar" aria-label="训练模板"></div>
        </div>
      </section>
      <details class="history-panel" id="history">
        <summary><span>训练记录 <b id="historyCount"></b></span><span aria-hidden="true">＋</span></summary>
        <div class="history-content">
          <div class="history-actions"><button type="button" class="outline-button" id="exportCsv">导出 CSV</button><button type="button" class="outline-button" id="exportJson">备份记录</button></div>
          <div id="historyList"></div><div class="legacy-note" id="legacyNote"></div>
          <p class="data-note">记录保存在当前浏览器，换设备前请备份。</p>
        </div>
      </details>
      <p class="save-status" id="saveStatus" role="status"></p>
    </main>
    <dialog class="workout-dialog" id="workout" aria-labelledby="workout-title">
      <div class="dialog-heading"><h2 id="workout-title">训练记录</h2><button type="button" class="icon-button" id="closeWorkout" aria-label="关闭"><svg class="icon"><use href="#i-close" /></svg></button></div>
      <article id="sessionCard"></article>
    </dialog>
    <footer class="site-footer shell"><span>按实际训练记录</span><a href="../docs/使用说明.md" download="使用说明.md">使用说明</a></footer>
    <script src="training.js"></script><script src="app.js"></script><script src="mobile.js"></script>
  </body>
</html>
